<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>蛋壳 · 错题复习</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--surface:#111111;--surface2:#181818;--border:#222222;--border2:#333333;
  --text:#EBE7DC;--text2:#A09880;--text3:#5E5848;
  --gold:#D4A853;--gold2:#F0C860;--gold-light:rgba(212,168,83,0.10);--gold-glow:rgba(212,168,83,0.20);
  --accent:var(--gold);--accent-l:var(--gold-light);--accent-glow:var(--gold-glow);
  --green:#4ADE80;--green-l:rgba(74,222,128,0.10);
  --orange:#F59E0B;--orange-l:rgba(245,158,11,0.12);
  --red:#F87171;--red-l:rgba(248,113,113,0.08);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --font:'Kanit',"PingFang SC","Microsoft YaHei UI",sans-serif;
  --t:.25s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;overflow:hidden}

/* scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ===== SIDEBAR ===== */
#sidebar{width:248px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sb-h{padding:18px 16px 14px;border-bottom:1px solid var(--border);position:relative}
.sb-h::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4}
.sb-h h1{font-size:16px;font-weight:800;letter-spacing:-0.3px;display:flex;align-items:center;gap:4px}
.sb-h h1 span{background:linear-gradient(135deg,#C89B3C,#E8C55A,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.sb-h p{font-size:10px;color:var(--text3);margin-top:2px;font-weight:300;letter-spacing:0.5px}

.sb-nav{padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.sb-nav button{padding:9px 12px;border:none;border-radius:10px;background:transparent;font-size:12px;font-family:var(--font);cursor:pointer;text-align:left;color:var(--text2);font-weight:400;display:flex;align-items:center;gap:8px;transition:all var(--t);letter-spacing:0.2px}
.sb-nav button:hover{background:var(--surface2);color:var(--text)}
.sb-nav button.active{background:var(--accent-l);color:var(--accent);font-weight:600}
.sb-nav .badge{font-size:9px;background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;margin-left:auto;font-weight:600;min-width:18px;text-align:center}

.sb-subjects{flex:1;overflow-y:auto;padding:4px 10px}
.sb-subjects .tt{font-size:9px;color:var(--text3);padding:10px 6px 6px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.sb-subjects .sj{padding:7px 10px;border-radius:10px;cursor:pointer;font-size:11px;color:var(--text2);margin-bottom:1px;transition:all var(--t);display:flex;align-items:center;gap:8px;font-weight:400}
.sb-subjects .sj:hover{background:var(--surface2);color:var(--text)}
.sb-subjects .sj.active{background:var(--accent-l);color:var(--accent);font-weight:500}
.sb-subjects .sj b{font-size:10px;color:var(--red);margin-left:auto;font-weight:600;background:var(--red-l);padding:1px 6px;border-radius:8px}
.sb-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:9px;color:var(--text3);font-weight:300;letter-spacing:0.5px;display:flex;align-items:center;gap:6px}
.sb-footer::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}

/* ===== MAIN ===== */
#main{flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.main-header{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.main-header h2{font-size:15px;font-weight:700;flex:1;letter-spacing:-0.3px}
.main-content{flex:1;overflow-y:auto;padding:24px}

/* ===== BUTTONS ===== */
.btn{padding:7px 16px;border:1px solid var(--border2);border-radius:24px;font-size:11px;font-family:var(--font);cursor:pointer;background:var(--surface);color:var(--text2);font-weight:500;transition:all var(--t);letter-spacing:0.3px}
.btn:hover{background:var(--surface2);border-color:var(--text3);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,#B8860B,#D4A853,#C89B3C);color:#111;border:none;font-weight:600;box-shadow:0 2px 12px rgba(212,168,83,.3)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(212,168,83,.5);opacity:1}
.btn.danger{color:var(--red);border-color:rgba(239,68,68,0.3)}
.btn.danger:hover{background:var(--red-l);border-color:var(--red)}
.btn.small{padding:4px 12px;font-size:10px;border-radius:18px}

/* subject chips */
.subj-chip{padding:5px 14px;border:1px solid var(--border2);border-radius:20px;font-size:10px;cursor:pointer;background:var(--surface);color:var(--text2);transition:all var(--t);white-space:nowrap;font-weight:400;letter-spacing:0.3px}
.subj-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.subj-chip.active{background:linear-gradient(135deg,#B8860B,#D4A853);color:#111;border-color:transparent;font-weight:600;box-shadow:0 2px 10px rgba(212,168,83,.3)}

/* ===== PASTE AREA ===== */
.paste-area{padding:20px}
.paste-area textarea{width:100%;min-height:280px;border:1px solid var(--border2);border-radius:var(--radius-lg);padding:18px;font-size:13px;font-family:var(--font);line-height:1.8;resize:vertical;background:var(--surface2);color:var(--text);transition:all var(--t)}
.paste-area textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l);background:var(--surface)}
.paste-area textarea::placeholder{color:var(--text3)}

/* ===== QUESTION LIST ===== */
.q-list{max-width:800px;margin:0 auto}
.q-item{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:10px;background:var(--surface);display:flex;gap:12px;align-items:flex-start;transition:all var(--t)}
.q-item:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.q-item.checked{background:var(--red-l);border-color:rgba(239,68,68,0.3);border-left:3px solid var(--red)}
.q-checkbox{width:22px;height:22px;border:2px solid var(--border2);border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all var(--t);margin-top:2px}
.q-checkbox:hover{border-color:var(--red)}
.q-item.checked .q-checkbox{background:var(--red);border-color:var(--red);color:#fff}
.q-body{flex:1;min-width:0}
.q-num{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px;letter-spacing:-0.2px}
.q-stem{font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--text)}
.q-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.q-tag{font-size:9px;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--text2);font-weight:500}
.q-tag.kp{background:var(--orange-l);color:var(--orange);cursor:pointer;font-weight:500}
.q-tag.kp:hover{background:var(--orange);color:#fff}

/* ===== WRONG BOOK ===== */
.wb-item{border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;background:var(--surface);overflow:hidden;transition:all var(--t)}
.wb-item:hover{border-color:var(--accent);box-shadow:0 2px 16px rgba(0,0,0,.2)}
.wb-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background var(--t)}
.wb-header:hover{background:var(--surface2)}
.wb-num{font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;font-family:var(--font)}
.wb-stem{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.wb-arrow{font-size:11px;color:var(--text3);transition:transform var(--t);flex-shrink:0}
.wb-item.open .wb-arrow{transform:rotate(180deg)}
.wb-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.wb-item.open .wb-body{display:block}
.wb-sec{margin-top:14px}
.wb-sec .lbl{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.wb-sec .val{font-size:13px;line-height:1.8;padding:12px 14px;border-radius:var(--radius)}
.wb-sec .val.kp{background:var(--orange-l);cursor:pointer;color:var(--orange);font-weight:500}
.wb-sec .val.kp:hover{background:rgba(245,158,11,0.2)}
.wb-sec .val.ans{background:var(--green-l);font-weight:600;color:var(--green);display:none}
.wb-sec .val.ans.show{display:block}
.wb-sec .val.exp{background:var(--surface2);color:var(--text2)}
.wb-actions{display:flex;gap:8px;margin-top:12px}

/* ===== RANDOM REVIEW ===== */
.float-card{position:absolute;width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:16px;cursor:pointer;transition:opacity .25s ease,transform .15s ease,box-shadow .15s ease,z-index .15s;transform-style:preserve-3d;perspective:600px;opacity:0;pointer-events:none}
.float-card.visible{opacity:1;pointer-events:auto}
.float-card.glow{z-index:100!important;box-shadow:0 0 30px rgba(212,168,83,.3),0 8px 24px rgba(0,0,0,.4);border-color:var(--gold)}
.float-card .fc-num{font-size:11px;font-weight:700;color:var(--gold)}
.float-card .fc-stem{font-size:11px;line-height:1.6;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.float-card .fc-subject{font-size:9px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.float-card.expanded{position:fixed!important;inset:50% auto auto 50%!important;transform:translate(-50%,-50%)!important;width:420px;max-width:90vw;z-index:200!important;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.float-card.expanded .fc-stem{-webkit-line-clamp:unset;font-size:13px;color:var(--text)}
.float-card.expanded .fc-full{display:block}
.float-card .fc-full{display:none;margin-top:10px}
.float-card .fc-full .fc-ans{background:var(--green-l);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--green);margin-top:6px;display:none}
.float-card .fc-full .fc-ans.show{display:block}
#random-canvas{opacity:.03}

.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty .icon{font-size:56px;opacity:.2;margin-bottom:16px}
.empty p{font-size:12px;line-height:1.8}

/* ===== INPUTS/SELECTS ===== */
input[type="text"],select{border:1px solid var(--border2);border-radius:10px;background:var(--surface2);color:var(--text);font-family:var(--font);transition:all var(--t)}
input[type="text"]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
#prompt-preview a{color:var(--accent);text-decoration:none;font-weight:500}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#1F1F2E,#2A2A3C);color:#fff;padding:10px 24px;border-radius:28px;font-size:11px;z-index:200;pointer-events:none;opacity:0;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid var(--border2);font-weight:500;letter-spacing:0.3px}
#toast.show{animation:toastIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* ===== ANIMATIONS ===== */
@keyframes celebrate{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(10deg)}60%{transform:scale(.9) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fadeSlideUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}

.q-item{animation:fadeSlideUp .4s ease both}
.q-item:nth-child(1){animation-delay:0s}
.q-item:nth-child(2){animation-delay:.04s}
.q-item:nth-child(3){animation-delay:.08s}
.q-item:nth-child(4){animation-delay:.12s}
.q-item:nth-child(5){animation-delay:.16s}
.q-item:nth-child(n+6){animation-delay:.2s}

.q-checkbox.celebrate{animation:celebrate .5s ease}
.wb-item.open .wb-body{animation:fadeSlideUp .35s ease}

/* spark粒子 */
.spark{position:fixed;pointer-events:none;z-index:300;width:6px;height:6px;border-radius:50%;animation:spark .6s ease forwards}

.subj-chip{transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.subj-chip:hover{transform:translateY(-2px) scale(1.05)}

.q-item.checked{animation:celebrate .4s ease}

/* page enter */
#view-questions:not([style*="none"]) .q-list,#view-wrongbook:not([style*="none"]) #wrongbook-list,#view-papers:not([style*="none"]) #papers-list{animation:fadeSlideUp .3s ease}

/* ===== MOBILE ===== */
@media(max-width:768px){
  #sidebar{width:60px;overflow:hidden}
  #sidebar .sb-h h1{font-size:0;display:none}
  #sidebar .sb-h p{display:none}
  #sidebar .sb-h{padding:10px 8px}
  #sidebar .sb-nav button{font-size:0;padding:10px 6px;justify-content:center;gap:0}
  #sidebar .sb-nav button::before{font-size:16px}
  #sidebar .sb-nav button[data-page="paste"]::before{content:'↓'}
  #sidebar .sb-nav button[data-page="questions"]::before{content:'☰'}
  #sidebar .sb-nav button[data-page="wrongbook"]::before{content:'✕'}
  #sidebar .sb-nav button[data-page="papers"]::before{content:'▤'}
  #sidebar .sb-nav button[data-page="random"]::before{content:'◇'}
  #sidebar .badge{font-size:7px;min-width:14px;position:absolute;top:4px;right:2px}
  #sidebar .sb-nav button{position:relative}
  #sidebar .sb-subjects{display:none}
  #sidebar .sb-footer{display:none}
  .main-header{padding:8px 12px}
  .main-header h2{font-size:13px}
  .main-content{padding:12px}
  #prompt-preview{font-size:10px!important}
  .paste-area textarea{min-height:200px;font-size:11px;padding:10px}
  .float-card{width:160px;padding:10px}
  .float-card.expanded{width:90vw}
  .q-item{padding:10px 12px}
}
/* ===== 3D TILT ===== */
.q-item,.wb-item{transform-style:preserve-3d;perspective:800px;transition:transform .15s ease,box-shadow .15s ease}
.q-item:hover,.wb-item:hover{box-shadow:0 20px 40px rgba(0,0,0,.4)}
.q-item .q-body,.wb-item .wb-header,.wb-item .wb-body{transform:translateZ(20px)}
/* ===== HOVER GLOW ===== */
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-100%);transition:transform .6s}
.btn.primary:hover::after{transform:translateX(100%)}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-h"><h1><span>蛋壳</span></h1><p>错题复习</p></div>
  <div class="sb-nav">
    <button class="active" data-page="paste">导入题目</button>
    <button data-page="questions">题目列表</button>
    <button data-page="wrongbook">错题本 <span class="badge" id="wb-badge">0</span></button>
    <button data-page="papers">试卷库</button>
    <button data-page="random">随机复习</button>
  </div>
  <div class="sb-subjects" id="sb-subjects"><div class="tt">错题集 · 按学科</div></div>
  <div class="sb-footer">数据本地存储</div>
</div>

<div id="main">
  <div class="main-header">
    <h2 id="page-title">导入题目</h2>
    <span style="font-size:11px;color:var(--text3);" id="page-count"></span>
    <button class="btn small" onclick="Store.exportData()">导出</button>
    <button class="btn small" onclick="Store.importData()">导入</button>
  </div>
  <div class="main-content" id="main-content">

    <!-- 导入页 -->
    <div id="view-paste">
      <div style="text-align:center;margin-bottom:24px;">
        <h2 style="font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;letter-spacing:-1px;">
          导入<span style="background:linear-gradient(135deg,#C89B3C,#E8C55A,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">试卷</span>
        </h2>
        <p style="color:var(--text3);font-size:12px;margin-top:4px;">三步完成 · DeepSeek 出题 → 平台收纳</p>
      </div>

      <!-- 三步引导 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:660px;margin:0 auto 20px;">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#C89B3C,#B8860B);color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:6px;">1</div>
          <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;">选学科·复制指令</div>
          <div style="font-size:10px;color:var(--text3);line-height:1.5;">点学科标签自动生成<br>粘贴到 DeepSeek</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#C89B3C,#B8860B);color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:6px;">2</div>
          <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;">上传试卷·获取解析</div>
          <div style="font-size:10px;color:var(--text3);line-height:1.5;">在 DeepSeek 上传PDF<br>获取题目+答案+知识点</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#C89B3C,#B8860B);color:#111;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:6px;">3</div>
          <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;">粘贴回来·一键解析</div>
          <div style="font-size:10px;color:var(--text3);line-height:1.5;">贴回下方文本框<br>自动拆题·入库复习</div>
        </div>
      </div>

      <!-- 学科选择 -->
      <div style="max-width:660px;margin:0 auto 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;">
        <div style="font-size:10px;color:var(--text3);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px;">选择学科</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <span class="subj-chip active" onclick="pickSubject('高等数学')">高等数学</span>
          <span class="subj-chip" onclick="pickSubject('线性代数')">线性代数</span>
          <span class="subj-chip" onclick="pickSubject('概率统计')">概率统计</span>
          <span class="subj-chip" onclick="pickSubject('大学物理')">大学物理</span>
          <span class="subj-chip" onclick="pickSubject('化学')">化学</span>
          <span class="subj-chip" onclick="pickSubject('英语')">英语</span>
          <span class="subj-chip" onclick="pickSubject('政治')">政治</span>
          <span class="subj-chip" onclick="pickSubject('近代史')">近代史</span>
          <span class="subj-chip" onclick="pickSubject('计算机')">计算机</span>
          <span class="subj-chip" onclick="pickSubject('经济学')">经济学</span>
          <input type="text" id="subject-input" placeholder="其他..." style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;width:80px;background:var(--surface2);">
        </div>
      </div>

      <!-- 指令预览+粘贴 -->
      <div style="max-width:660px;margin:0 auto;">
        <div style="background:var(--surface);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:11px;line-height:1.7;position:relative;overflow:hidden;" id="prompt-preview">
          <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--gold),transparent);"></div>
          <div style="padding-left:4px;">选学科 → 点「复制指令」→ 粘贴到 <a href="https://chat.deepseek.com" target="_blank" style="color:var(--gold);font-weight:600;">DeepSeek</a></div>
        </div>
        <textarea id="paste-input" placeholder="把 DeepSeek 返回的内容粘贴到这里...&#10;&#10;格式：&#10;**1.** 题目&#10;**答案：** ...&#10;**解析：** ...&#10;**知识点：** ..." style="margin-bottom:10px;"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn" onclick="copyPrompt()">复制指令</button>
          <button class="btn primary" onclick="Parser.parse()" style="font-size:13px;padding:8px 28px;">解析题目</button>
        </div>
      </div>
    </div>

    <!-- 题目列表 -->
    <div id="view-questions" style="display:none;"><div class="q-list" id="q-list"></div></div>

    <!-- 错题本 -->
    <div id="view-wrongbook" style="display:none;">
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
        <select id="wb-filter" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;" onchange="filterBySubject(this.value);renderWrongBook()">
          <option value="all">全部学科</option>
        </select>
        <input id="wb-search" placeholder="搜索..." style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;flex:1;min-width:100px;" oninput="renderWrongBook()">
        <button class="btn small danger" onclick="if(confirm('确定清空？')){Store.clearWrongBook();render();}">清空</button>
      </div>
      <div id="wrongbook-list"></div>
      <div class="empty" id="wrongbook-empty"><div class="icon">—</div><p>错题本为空</p></div>
    </div>

    <!-- 试卷库 -->
    <div id="view-papers" style="display:none;">
      <div class="q-list" id="papers-list"></div>
      <div class="empty" id="papers-empty"><div class="icon">📄</div><p>暂无试卷</p><p style="font-size:11px;">导入题目后自动收录</p></div>
    </div>

    <!-- 随机复习 -->
    <div id="view-random" style="display:none;position:relative;overflow:hidden;min-height:100%;">
      <canvas id="random-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:0;"></canvas>
      <div id="random-cards" style="position:relative;z-index:1;padding:20px;"></div>
      <div class="empty" id="random-empty"><div class="icon">🎲</div><p>错题本为空，先去收录错题吧</p></div>
    </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ========== DB ==========
const DB = {
  _db:null,
  async open(){if(this._db)return this._db;return new Promise((ok,fail)=>{const r=indexedDB.open('wb_v2',2);r.onupgradeneeded=(e)=>{const d=r.result;if(!d.objectStoreNames.contains('wrongbook'))d.createObjectStore('wrongbook');if(!d.objectStoreNames.contains('papers'))d.createObjectStore('papers');};r.onsuccess=()=>{this._db=r.result;ok(r.result);};r.onerror=()=>fail(r.error);});},
  async put(s,k,v){try{const db=await this.open();return new Promise(ok=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=ok;t.onerror=ok;});}catch(e){console.error('DB put error:',s,k,e);}},
  async get(s,k){try{const db=await this.open();return new Promise(ok=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null);});}catch(e){return null;}},
  async del(s,k){try{const db=await this.open();return new Promise(ok=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=ok;t.onerror=ok;});}catch(e){}},
  async getAll(s){try{const db=await this.open();return new Promise(ok=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([]);});}catch(e){return [];}},
};

// ========== STORE ==========
const Store = {
  questions:[], wrongBook:[], papers:[], currentPage:'paste', activeSubject:'all', batchName:'',
  async load(){try{this.wrongBook=await DB.getAll('wrongbook');}catch(e){this.wrongBook=[];}try{this.papers=await DB.getAll('papers')||[];}catch(e){this.papers=[];}},
  async addToWB(q){if(this.wrongBook.find(w=>w.id===q.id))return false;const s=q._userSubject||guessSubject(q);const item={...q,subject:s,addedAt:Date.now(),reviewCount:0};this.wrongBook.push(item);await DB.put('wrongbook',q.id,item);return true;},
  async removeFromWB(id){this.wrongBook=this.wrongBook.filter(w=>w.id!==id);await DB.del('wrongbook',id);},
  async clearWrongBook(){for(const w of this.wrongBook)await DB.del('wrongbook',w.id);this.wrongBook=[];},
  async savePaper(p){this.papers.push(p);await DB.put('papers',p.id,p);},
  async exportData(){const j=JSON.stringify({wrongBook:this.wrongBook,papers:this.papers,d:Date.now()});const b=new Blob([j],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='错题本_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('✅已导出');},
  async importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(d.wrongBook){for(const w of d.wrongBook){if(!this.wrongBook.find(x=>x.id===w.id)){this.wrongBook.push(w);await DB.put('wrongbook',w.id,w);}}}if(d.papers){for(const p of d.papers){if(!this.papers.find(x=>x.id===p.id)){this.papers.push(p);await DB.put('papers',p.id,p);}}}render();toast('✅导入完成');}catch(e){toast('❌格式错误');}};i.click();},
};

// ========== 学科 ==========
const SUBJECTS = ['数学','物理','化学','生物','英语','政治','历史','地理','计算机','经济','其他'];
function guessSubject(item){
  if(item._userSubject)return item._userSubject;if(item.subject)return item.subject;
  const map={数学:['函数','方程','导数','积分','微积分','矩阵','向量','概率','几何','代数'],物理:['力学','运动','速度','力','能量','电场','磁场','光学','热学','量子','波动','电磁'],化学:['化学','分子','原子','反应','元素','酸碱','氧化','还原'],生物:['细胞','基因','DNA','蛋白','酶','光合','遗传','进化'],英语:['英语','语法','词汇','阅读','翻译'],政治:['政治','马克思','时政','党史','社会主义'],历史:['历史','战争','革命','朝代','条约','改革'],地理:['地理','气候','地形','人口','资源'],计算机:['编程','算法','数据','网络','代码'],经济:['经济','市场','价格','GDP','通胀']};
  const all=[...(item.knowledgePoints||[]),item.stem||''].join(' ');let best='其他',bs=0;
  for(const[s,kws]of Object.entries(map)){let sc=0;kws.forEach(k=>{if(all.includes(k))sc++;});if(sc>bs){bs=sc;best=s;}}
  return best;
}
function filterBySubject(s){Store.activeSubject=s;render();}

function renderSubjects(){
  const el=document.getElementById('sb-subjects');
  const wc={};Store.wrongBook.forEach(w=>{const s=w.subject||guessSubject(w);wc[s]=(wc[s]||0)+1;});
  const pc={};Store.papers.forEach(p=>{const s=p.subject||'其他';pc[s]=(pc[s]||0)+1;});
  const all=[...new Set([...Object.keys(wc),...Object.keys(pc)])].sort();
  el.innerHTML='<div class="tt">📚 错题集·按学科</div>'+
    `<div class="sj${Store.activeSubject==='all'?' active':''}" onclick="filterBySubject(\'all\')">全部 <b>${Store.wrongBook.length}</b></div>`+
    all.map(s=>`<div class="sj${Store.activeSubject===s?' active':''}" onclick="filterBySubject('${s}')">${s} ${wc[s]?`<b>${wc[s]}题</b>`:'<span style="color:var(--text3);">0</span>'}</div>`).join('');
}

window.pickSubject=function(s){
  document.getElementById('subject-input').value=s;
  document.querySelectorAll('.subj-chip').forEach(c=>c.classList.toggle('active',c.textContent.trim()===s));
  copyPrompt();
};

// ========== 指令复制 ==========
function getPrompt(){
  const s=document.getElementById('subject-input').value.trim()||'请填写学科';
  return `这是一份《${s}》试卷。先输出标题行（含年份/单元）：
## 2024年${s}期末试卷

然后逐题整理，每题四部分：
**题号. 题目**（完整题干，选择题写选项 A.xx B.xx C.xx D.xx）
**答案：**（正确答案）
**解析：**（详细解答过程，保留推导和得分标注）
**知识点：**（知识点，逗号分隔）

题号用数字（1.2.3.）。每题空行隔开。

🚫🚫🚫 禁止LaTeX！禁止\\( \\) \\[ \\] $...$！数学用纯文本：
分式a/b 偏导∂z/∂x 积分∫₀¹f(x)dx 根号√(x²+1)
希腊αβγθλπσφω 向量v⃗ ≠≤≥≈±∞ Σ lim → ⇒ 上标x²xⁿ 下标x₁xₙ`;
}
function copyPrompt(){
  navigator.clipboard.writeText(getPrompt()).then(()=>toast('✅已复制！粘贴到DeepSeek'),()=>toast('复制失败，请手动选择'));
}

// ========== 解析器 ==========
const Parser = {
  parse(){
    const raw=document.getElementById('paste-input').value.trim();
    if(!raw){toast('请先粘贴DeepSeek回复');return;}

    const lines=raw.split('\n');
    const questions=[];let current=null,buf='',qc=0;
    const CN={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
    const RE=[
      /^\*?\*?\s*([一二三四五六七八九十]+)\s*[（(]\s*(\d+)\s*[）)]\s*[\.、．]?\*?\*?\s*/,
      /^\*?\*?\s*[（(]\s*(\d+)\s*[）)]\s*[\.、．]?\*?\*?\s*/,
      /^\*?\*?\s*(\d+)\s*[\.、．)）]\*?\*?\s*/,
      /^\*?\*?\s*([一二三四五六七八九十]+)\s*[\.、．]\*?\*?\s*/,
    ];

    for(const line of lines){
      let matched=false;
      for(const re of RE){
        const m=line.match(re);if(!m)continue;
        if(current){current.raw=buf.trim();this._extract(current);questions.push(current);}
        qc++;let ns;if(m[2]){ns=(CN[m[1]]||m[1])+'-'+m[2];}else if(CN[m[1]]){ns=String(CN[m[1]]);}else{ns=m[1];}
        current={id:'q'+Date.now()+'_'+qc,number:ns,raw:''};buf=line.slice(m[0].length)+'\n';matched=true;break;
      }
      if(!matched&&current)buf+=line+'\n';
    }
    if(current){current.raw=buf.trim();this._extract(current);questions.push(current);}
    if(!questions.length){toast('未识别到题目。题号格式：1. / 一、/ （1）/ 二（5）');return;}

    // 去重：对比第一题
    const firstQ = (questions[0].stem||'').replace(/\s+/g,' ').trim().slice(0,80);
    const dup = Store.papers.find(p=>{
      const pf = (p.firstQ||'').replace(/\s+/g,' ').trim().slice(0,80);
      return pf && pf.length>10 && pf===firstQ;
    });
    if(dup){toast('⏭ 已跳过：与《'+esc(dup.name)+'》是同一份试卷');return;}

    const userSubject=document.getElementById('subject-input').value.trim();
    // 尝试多种标题格式：## Title / # Title / 第一行正文
    let title = '';
    const h2=raw.match(/^##\s*(.+)/m); if(h2)title=h2[1].trim();
    if(!title){const h1=raw.match(/^#\s*(.+)/m); if(h1)title=h1[1].trim();}
    if(!title){const first=raw.split('\n').find(l=>l.trim().length>4&&l.trim().length<60); if(first)title=first.replace(/^\*+/,'').replace(/\*+$/,'').trim();}
    Store.batchName = title || (userSubject+'·试卷') || '未命名试卷';
    const pid='p'+Date.now();
    const paperObj = {id:pid,name:Store.batchName,subject:userSubject||guessSubject({stem:raw}),date:Date.now(),count:questions.length,firstQ};
    Store.papers.push(paperObj);
    DB.put('papers',pid,paperObj);
    DB.put('papers',pid+'_qs',questions.map(q=>({...q,paperId:pid})));
    if(userSubject)questions.forEach(q=>{q._userSubject=userSubject;q.paperId=pid;});

    // 清理 ** 标记
    questions.forEach(q=>{q.stem=q.stem.replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1');q.answer=q.answer.replace(/\*{1,2}/g,'');q.explanation=q.explanation.replace(/\*{1,2}([^*]+)\*{1,2}/g,'$1');});

    Store.questions=questions;Store.currentPage='questions';render();toast(`✅ ${questions.length}题`);
  },

  _extract(q){
    let r=q.raw.replace(/^[\s\n]+|[\s\n]+$/g,'');
    const am=r.match(/\n\*{0,2}\s*答案\s*\*{0,2}\s*[:：]\s*/);
    const em=r.match(/\n\*{0,2}\s*解析\s*\*{0,2}\s*[:：]\s*/);
    const km=r.match(/\n\*{0,2}\s*知识点\s*\*{0,2}\s*[:：]\s*/);
    const pts=[am,em,km].filter(Boolean).map(m=>m.index);
    q.stem=r.slice(0,pts.length?Math.min(...pts):r.length).trim();
    q.answer=this._val(r,am,em);q.explanation=this._val(r,em,km);
    q.knowledgePoints=[];q.subjects=[];
    if(km){
      const ke=[am,em].filter(m=>m&&m.index>km.index).map(m=>m.index);
      const kt=ke.length?r.slice(km.index+km[0].length,Math.min(...ke)):r.slice(km.index+km[0].length);
      q.knowledgePoints=kt.trim().split(/[,;，；、\n]/).map(s=>s.replace(/^[\s\*\-·•\d.]+|[\s\*\-·•]+$/g,'').trim()).filter(s=>s.length>0&&s.length<40);
    }
    const g=guessSubject(q);if(g!=='其他')q.subjects=[g];
    // 题型
    const st=q.stem;if(/[A-D]\s*[\.、．]\s/.test(st))q.type='single_choice';
    else if(/填空|___|____|（\s*）/.test(st))q.type='fill_blank';
    else if(/计算|求解|证明|推导/.test(st))q.type='calculation';
    else if(/论述|分析|谈谈|为何/.test(st))q.type='essay';else q.type='short_answer';
  },
  _val(t,sm,nm){if(!sm)return'';const s=sm.index+sm[0].length;const e=(nm&&nm.index>sm.index)?nm.index:t.length;return t.slice(s,e).trim().replace(/\*{1,2}$/m,'').trim();},
};

// ========== RENDER ==========
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function tn(t){return{single_choice:'单选',multiple_choice:'多选',fill_blank:'填空',short_answer:'简答',calculation:'计算',essay:'论述'}[t]||'题';}
function fm(t){if(!t)return'';let h=esc(t).replace(/\\\(|\\\)|\\\[|\\\]/g,'');
const S='₀₁₂₃₄₅₆₇₈₉ₐₑᵢₒᵤₓₙₘₜₕₖₗₚᵣₛₜᵤᵥ',P='⁰¹²³⁴⁵⁶⁷⁸⁹ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻ',A='0123456789abcdefghijklmnopqrstuvwxyz';
h=h.replace(/_\{([^}]+)\}/g,(_,c)=>c.split('').map(ch=>{let i=A.indexOf(ch);return i>=0?S[i]:ch;}).join(''));
h=h.replace(/\^\{([^}]+)\}/g,(_,c)=>c.split('').map(ch=>{let i=A.indexOf(ch);return i>=0?P[i]:ch;}).join(''));
h=h.replace(/_([0-9a-zA-Z])/g,(_,c)=>{let i=A.indexOf(c);return i>=0?S[i]:'_'+c;});
h=h.replace(/\^([0-9a-zA-Z])/g,(_,c)=>{let i=A.indexOf(c);return i>=0?P[i]:'^'+c;});
h=h.replace(/\\sum\s*_\{(.+?)\}\s*\^\{(.+?)\}/g,'Σ$1→$2').replace(/\\sum/g,'Σ');
h=h.replace(/\\int\s*_\{(.+?)\}\s*\^\{(.+?)\}/g,'∫$1→$2').replace(/\\int/g,'∫');
h=h.replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1)/($2)');
h=h.replace(/\\sqrt\{([^}]+)\}/g,'√($1)');
h=h.replace(/\\vec\{([^}]+)\}/g,'$1⃗');
[['\\prod','Π'],['\\infty','∞'],['\\partial','∂'],['\\times','×'],['\\cdot','·'],
 ['\\alpha','α'],['\\beta','β'],['\\gamma','γ'],['\\delta','δ'],['\\theta','θ'],
 ['\\lambda','λ'],['\\mu','μ'],['\\pi','π'],['\\sigma','σ'],['\\phi','φ'],['\\omega','ω'],
 ['\\neq','≠'],['\\leq','≤'],['\\geq','≥'],['\\approx','≈'],['\\pm','±'],['\\mp','∓'],
 ['\\rightarrow','→'],['\\Rightarrow','⇒'],['\\to','→'],['\\lim','lim'],['\\ln','ln'],
 ['\\sin','sin'],['\\cos','cos'],['\\tan','tan']].forEach(([a,b])=>h=h.replace(new RegExp(a,'g'),b));
h=h.replace(/\\left[\(\[]/g,'(').replace(/\\right[\)\]]/g,')');
h=h.replace(/\\begin\{cases\}/g,'{').replace(/\\end\{cases\}/g,'');
h=h.replace(/\\[a-zA-Z]+/g,'');h=h.replace(/\n/g,'<br>');
h=h.replace(/([A-D])\s*[\.、．]\s*/g,'<b style="color:var(--accent);">$1.</b> ');return h;}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}
function sparkAt(x,y){for(let i=0;i<8;i++){const s=document.createElement('div');s.className='spark';const a=(Math.PI*2*i)/8;s.style.cssText=`left:${x}px;top:${y}px;--sx:${Math.cos(a)*40}px;--sy:${Math.sin(a)*40}px;background:${['#D4A853','#F0C860','#C89B3C','#E8C55A'][i%4]};`;document.body.appendChild(s);setTimeout(()=>s.remove(),700);}}

function render(){
  document.querySelectorAll('.sb-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===Store.currentPage));
  const titles={paste:'导入题目',questions:Store.batchName,wrongbook:'错题本',papers:'试卷库',random:'随机复习'};
  document.getElementById('page-title').textContent=titles[Store.currentPage]||'';
  document.getElementById('page-count').textContent=Store.currentPage==='questions'?Store.questions.length+'题':Store.currentPage==='wrongbook'?Store.wrongBook.length+'题':Store.currentPage==='papers'?Store.papers.length+'份':'';
  document.getElementById('view-paste').style.display=Store.currentPage==='paste'?'':'none';
  document.getElementById('view-questions').style.display=Store.currentPage==='questions'?'':'none';
  document.getElementById('view-wrongbook').style.display=Store.currentPage==='wrongbook'?'':'none';
  document.getElementById('view-papers').style.display=Store.currentPage==='papers'?'':'none';
  document.getElementById('view-random').style.display=Store.currentPage==='random'?'':'none';
  if(Store.currentPage==='questions')renderQuestions();
  if(Store.currentPage==='wrongbook')renderWrongBook();
  if(Store.currentPage==='papers')renderPapers();
  if(Store.currentPage==='random')renderRandom();
  document.getElementById('wb-badge').textContent=Store.wrongBook.length;
  renderSubjects();
}

function renderQuestions(){
  const el=document.getElementById('q-list');const wbIds=new Set(Store.wrongBook.map(w=>w.id));
  let list=Store.questions;if(Store.activeSubject!=='all')list=list.filter(q=>(q._userSubject||guessSubject(q))===Store.activeSubject);
  el.innerHTML=list.length?list.map(q=>{const inWB=wbIds.has(q.id);
    return`<div class="q-item${inWB?' checked':''}"><div class="q-checkbox" onclick="toggleWB('${q.id}',event)">${inWB?'✓':''}</div><div class="q-body"><div class="q-num">第${q.number}题 · ${tn(q.type)} · ${q._userSubject||guessSubject(q)}</div><div class="q-stem">${fm(q.stem)}</div>${q.answer?`<div style="font-size:11px;color:var(--green);margin-top:4px;"><b>答案：</b>${fm(q.answer)}</div>`:''}${q.knowledgePoints?.length?`<div class="q-meta">${q.knowledgePoints.map(k=>`<span class="q-tag kp">${esc(k)}</span>`).join('')}</div>`:''}</div></div>`;
  }).join(''):'<div class="empty"><div class="icon"></div><p>该学科暂无题目</p></div>';
}

function renderWrongBook(){
  const lel=document.getElementById('wrongbook-list'),eel=document.getElementById('wrongbook-empty');
  const sel=document.getElementById('wb-filter');
  const wc={};Store.wrongBook.forEach(w=>{const s=w.subject||guessSubject(w);wc[s]=(wc[s]||0)+1;});
  sel.innerHTML='<option value="all">全部学科</option>'+Object.keys(wc).sort().map(s=>`<option value="${s}"${Store.activeSubject===s?' selected':''}>${s}(${wc[s]})</option>`).join('');
  sel.value=Store.activeSubject;

  let list=Store.wrongBook;if(Store.activeSubject!=='all')list=list.filter(w=>(w.subject||guessSubject(w))===Store.activeSubject);
  const q=(document.getElementById('wb-search')?.value||'').toLowerCase();if(q)list=list.filter(w=>(w.stem||'').toLowerCase().includes(q)||(w.number||'').includes(q));
  list.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  if(!list.length){lel.innerHTML='';eel.style.display='';return;}eel.style.display='none';

  lel.innerHTML=list.map(w=>`<div class="wb-item" id="wb-${w.id}"><div class="wb-header" onclick="document.getElementById('wb-${w.id}').classList.toggle('open')"><span class="wb-num">#${w.number}</span><span style="font-size:9px;background:var(--orange-l);color:var(--orange);padding:1px 5px;border-radius:6px;">${w.subject||guessSubject(w)}</span><span class="wb-stem">${esc((w.stem||'').replace(/\n/g,' ').slice(0,50))}${(w.stem||'').length>50?'...':''}</span><span style="font-size:9px;color:var(--text3);margin-left:auto;">复习${w.reviewCount||0}次</span><span class="wb-arrow">▼</span></div><div class="wb-body">
    <div class="wb-sec"><div class="lbl">📝 题目</div><div class="val" style="background:var(--surface2);">${fm(w.stem)}</div></div>
    ${w.knowledgePoints?.length?`<div class="wb-sec"><div class="lbl">🧠 知识点</div><div class="val kp" onclick="document.getElementById('ans-${w.id}').classList.toggle('show')">${w.knowledgePoints.map(k=>esc(k)).join(' · ')}<div style="font-size:9px;color:var(--text3);margin-top:4px;">👆点击显示答案</div></div></div>`:''}
    ${w.answer?`<div class="wb-sec"><div class="lbl">✅ 答案</div><div class="val ans${w.knowledgePoints?.length?'':' show'}" id="ans-${w.id}">${fm(w.answer)}</div></div>`:''}
    ${w.explanation?`<div class="wb-sec"><div class="lbl">📖 解析</div><div class="val exp">${fm(w.explanation)}</div></div>`:''}
    <div class="wb-actions"><button class="btn small" onclick="Store.removeFromWB('${w.id}');render()">🗑移出</button><button class="btn small primary" onclick="reviewWB('${w.id}')">✅已复习(${w.reviewCount||0})</button></div></div></div>`).join('');
}

function renderPapers(){
  const el=document.getElementById('papers-list'),ee=document.getElementById('papers-empty');
  let list=(Store.papers||[]).filter(p=>p&&p.id);
  if(Store.activeSubject!=='all')list=list.filter(p=>p.subject===Store.activeSubject);
  list.sort((a,b)=>(b.date||0)-(a.date||0));
  if(!list.length){el.innerHTML='';ee.style.display='';return;}ee.style.display='none';
  el.innerHTML=list.map(p=>`<div class="q-item" style="cursor:pointer;"><div class="q-body" onclick="viewPaper('${p.id}')"><div class="q-num">${esc(p.name||'未命名')} · <span style="color:var(--orange);">${esc(p.subject||'未知')}</span></div><div style="font-size:11px;color:var(--text3);">${new Date(p.date||0).toLocaleDateString('zh-CN')} · ${p.count||0}题</div></div><button class="btn small danger" onclick="event.stopPropagation();event.preventDefault();removePaper('${p.id}')">🗑</button></div>`).join('');
}

async function viewPaper(pid){
  const qs=await DB.get('papers',pid+'_qs');
  if(!qs||!Array.isArray(qs)||!qs.length){toast('题目数据丢失，请重新导入');return;}
  Store.questions=qs;
  Store.batchName=(Store.papers.find(p=>p.id===pid)||{}).name||'试卷';
  Store.currentPage='questions';render();
  toast(`已加载 ${qs.length} 题`);
}

function removePaper(pid){
  if(!confirm('删除这份试卷？关联错题也会移除。'))return;
  deletePaper(pid);
}
async function deletePaper(pid){
  try{await DB.del('papers',pid);}catch(e){}
  try{await DB.del('papers',pid+'_qs');}catch(e){}
  const related=Store.wrongBook.filter(w=>w.paperId===pid);
  for(const w of related){try{await DB.del('wrongbook',w.id);}catch(e){}}
  Store.papers=(Store.papers||[]).filter(p=>p.id!==pid);
  Store.wrongBook=Store.wrongBook.filter(w=>w.paperId!==pid);
  render();toast('已删除');
}

async function toggleWB(qId,e){const q=Store.questions.find(q=>q.id===qId);if(!q)return;const cb=document.querySelector(`#q-${qId} .q-checkbox`);if(Store.wrongBook.find(w=>w.id===qId)){await Store.removeFromWB(qId);toast('已移出');}else{await Store.addToWB(q);toast('✅已加入错题本');if(cb){cb.classList.add('celebrate');setTimeout(()=>cb.classList.remove('celebrate'),500);}if(e){sparkAt(e.clientX,e.clientY);}}render();}
async function reviewWB(id){const w=Store.wrongBook.find(w=>w.id===id);if(!w)return;w.reviewCount=(w.reviewCount||0)+1;w.lastReviewed=Date.now();await DB.put('wrongbook',id,w);toast('✅已记录');}

// ========== 随机复习 ==========
function renderRandom(){
  const el=document.getElementById('random-cards'),ee=document.getElementById('random-empty');
  const list=Store.wrongBook;if(!list.length){el.innerHTML='';ee.style.display='';return;}ee.style.display='none';
  const area=document.getElementById('view-random');const W=area.clientWidth-20,H=Math.max(area.clientHeight-20,500);
  el.style.height=H+'px';el.innerHTML='';

  drawParticles();

  list.forEach((w,i)=>{
    const card=document.createElement('div');card.className='float-card';card.id='fc-'+w.id;
    card.innerHTML=`<div class="fc-num">#${w.number} · ${w.subject||guessSubject(w)}</div><div class="fc-stem">${esc(w.stem)}</div><div class="fc-subject">复习${w.reviewCount||0}次</div><div class="fc-full"><div class="fc-ans" id="fca-${w.id}">✅ ${esc(w.answer||'暂无答案')}</div>${w.explanation?`<div style="font-size:11px;color:var(--text3);margin-top:6px;line-height:1.6;">${esc(w.explanation.slice(0,200))}</div>`:''}<div style="margin-top:8px;display:flex;gap:6px;"><button class="btn small" onclick="event.stopPropagation();revealFloatAns('${w.id}')">答案</button><button class="btn small primary" onclick="event.stopPropagation();reviewWB('${w.id}');removeFloatCard('${w.id}')">✅ 已复习</button></div></div>`;
    const x=30+Math.random()*(W-280),y=30+Math.random()*(H-200);
    card.style.left=x+'px';card.style.top=y+'px';card.style.transform=`rotate(${(Math.random()-.5)*12}deg)`;
    // 存储位置
    card._x=x+110;card._y=y+80;
    card.addEventListener('click',()=>toggleFloatCard(card));
    el.appendChild(card);
  });

  // 全局鼠标追踪：靠近的卡片显形
  el.onmousemove=function(e){
    const rect=el.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    el.querySelectorAll('.float-card:not(.expanded)').forEach(card=>{
      const dx=mx-card._x,dy=my-card._y,dist=Math.sqrt(dx*dx+dy*dy);
      const radius=180;
      if(dist<radius){
        const alpha=1-dist/radius;
        card.style.opacity=alpha;card.classList.add('visible');
        const tilt=alpha>.5?'glow':'';
        card.classList.toggle('glow',alpha>.7);
        // 微微朝向光标
        const rx=(-dy/radius*12).toFixed(1),ry=(dx/radius*12).toFixed(1);
        card.style.transform=`rotate(${ry*0.2}deg) perspective(600px) rotateX(${rx}deg) rotateY(${ry}deg)`;
      }else{
        card.style.opacity='0';card.classList.remove('visible','glow');
      }
    });
  };
}

function toggleFloatCard(card){
  const wasExpanded=card.classList.contains('expanded');
  document.querySelectorAll('.float-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!wasExpanded)card.classList.add('expanded');
}

function revealFloatAns(id){document.getElementById('fca-'+id).classList.add('show');}
function removeFloatCard(id){const c=document.getElementById('fc-'+id);if(c){c.style.opacity='0';c.style.transform=c.style.transform+' scale(.8)';setTimeout(()=>c.remove(),400);}}

function drawParticles(){
  const canvas=document.getElementById('random-canvas');if(!canvas)return;
  const area=document.getElementById('view-random');canvas.width=area.clientWidth;canvas.height=area.clientHeight;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<40;i++){ctx.fillStyle=`rgba(212,168,83,${.03+.02*Math.random()})`;ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,1+Math.random()*2,0,Math.PI*2);ctx.fill();}
}

// ========== 3D TILT ==========
document.addEventListener('mousemove',e=>{
  document.querySelectorAll('.q-item:hover,.wb-item:hover').forEach(card=>{
    const r=card.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const rx=((y-r.height/2)/r.height*15).toFixed(1),ry=((x-r.width/2)/r.width*-15).toFixed(1);
    card.style.transform=`perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('.q-item,.wb-item'))return;
  document.querySelectorAll('.q-item,.wb-item').forEach(c=>c.style.transform='');
});

// ========== NAV & INIT ==========
document.querySelectorAll('.sb-nav button').forEach(b=>b.addEventListener('click',()=>{Store.currentPage=b.dataset.page;render();}));
(async()=>{await Store.load();render();})();
</script>
</body>
